    function showToast(msg, icon = "✨") {
      const box = document.getElementById("toastBox");
      const iconEl = document.getElementById("toastIcon");
      const textEl = document.getElementById("toastText");
      if (!box || !textEl) return;
      if (iconEl) iconEl.textContent = icon;
      textEl.textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add("hidden"), 2600);
    }

    function renderNavigation() {

      nav.innerHTML = MAIN_TABS.map(t => {

        return `
          <button
            type="button"
            data-tab-id="${t.id}"
            class="nav-tab-btn shrink-0 flex items-center gap-1.5 px-4 py-2.5 rounded-2xl font-black text-xs sm:text-sm border-2 transition ${
              isActive
                ? "bg-teal-600 text-white border-teal-700 shadow-xs"
                : "bg-white hover:bg-teal-50 text-slate-700 border-teal-100"
            }"
          >
            <span>${t.icon}</span>
            <span>${t.label}</span>
          </button>
        `;
      }).join("");

      nav.querySelectorAll(".nav-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.getAttribute("data-tab-id");
          renderNavigation();
          renderMainViewport();
        });
      });
    }

    function renderIepAdminTableRows() {

    function fetchIepBookings(password) {
      showToast("正在讀取試算表預約清單...", "⏳");
      const callbackName = "iepCallback_" + Date.now();
      window[callbackName] = function(result) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (result.success) {
          iepAdminRecords = result.bookings;
          isIepAdminUnlocked = true;
          isIepAdminDrawerOpen = true;
          renderMainViewport();
          showToast(`已載入 ${iepAdminRecords.length} 筆預約紀錄`, "📋");
        } else {
          showToast(result.message || "驗證失敗", "❌");
        }
      };

      const script = document.createElement("script");
      script.src = `${GAS_WEB_APP_URL}?action=getAdminBookings&password=${encodeURIComponent(password)}&callback=${callbackName}`;
      script.onerror = function() {
        showToast("無法連線至預約系統後端，請確認部署版本", "⚠️");
      };
      document.body.appendChild(script);
    }

    function executeDeleteBooking(sheetName, rowNumber, date, slot) {
      if (!confirm(`確定要刪除「${date} (${slot})」這筆會議預約嗎？\n刪除後該時段將立即開放重新預約。`)) return;

      showToast("正在刪除預約並釋出時段...", "⏳");
      const callbackName = "iepDelCallback_" + Date.now();
      
      window[callbackName] = function(result) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (result.success) {
          showToast("預約已成功刪除，時段已釋出！", "✅");
          fetchIepBookings("0000");
          const iframe = document.getElementById("iepIframe");
          if (iframe) iframe.src = iframe.src;
        } else {
          showToast(result.message || "刪除失敗", "❌");
        }
      };

      const script = document.createElement("script");
      const params = new URLSearchParams({
        action: "deleteBooking",
        password: "0000",
        sheetName: sheetName,
        rowNumber: rowNumber,
        date: date,
        slot: slot,
        callback: callbackName
      });
      script.src = `${GAS_WEB_APP_URL}?${params.toString()}`;
      script.onerror = function() {
        showToast("刪除連線逾時，請重試", "⚠️");
      };
      document.body.appendChild(script);
    }

    // 🌟 全自動歸納特教工具箱（自動依 category 分類，自動生出抽屜）
    function renderSpecialToolsView() {
      if (!isSpecialToolsUnlocked) {
        return `

                驗證並解鎖工具箱
              </button>
            </div>
          </div>
        `;
      }

      // 1. 自動篩選主要一般工具 (category === 'general' 或未設定者)
      const generalTools = specialToolsData.filter(t => !t.category || t.category === "general");

      // 2. 自動抓出所有自訂抽屜分類 (排除 general)
      const otherCategories = Array.from(new Set(
        specialToolsData
          .map(t => t.category)
          .filter(c => c && c !== "general")
      ));

      // 分類對應的預設圖示與中文名稱字典
      const categoryMeta = {
        "finance": { name: "經費相關工具", icon: "💰", subtitle: "特教助理人員鐘點費核銷、印領清冊自動產生" },
        "pe": { name: "適應體育專區", icon: "⚾", subtitle: "適性體育賽事、運動輔具與選手培訓表件" },
        "assistive": { name: "輔具與無障礙", icon: "♿", subtitle: "學生學習輔具評估、申請與借用維護" }
      };

      return `
        <div class="bg-gradient-to-b from-orange-50/30 to-white border-2 border-orange-100 rounded-3xl p-6 sm:p-10 space-y-8 w-full shadow-sm">
          
          <!-- 頂部標題與說明 -->

              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">特教工具箱</h2>
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-orange-100 text-orange-800 border border-orange-200">
                    專用整合
                  </span>

              </div>
            </div>
            <button type="button" id="btnLockSpecialTools"
              class="px-4 py-2 rounded-xl bg-white hover:bg-orange-50 border border-orange-200 text-slate-600 font-bold text-xs transition flex items-center gap-1.5 shadow-2xs">
              <span>🔒</span>
              <span>重新上鎖</span>
            </button>
          </div>

          <!-- 1. 一般教學與行政核心工具（一列 4 欄網格） -->
          ${generalTools.length > 0 ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

          <!-- 2. 🌟 動態分類折疊抽屜群（GAS 傳來什麼分類，就自動長出什麼抽屜） -->
          <div class="space-y-4">
            ${otherCategories.map(catKey => {
              const meta = categoryMeta[catKey] || { name: catKey, icon: "📁", subtitle: `${catKey} 專屬相關工具` };
              const catTools = specialToolsData.filter(t => t.category === catKey);
              const isOpen = !!openDrawersState[catKey];

              return `
                <div class="border-2 border-amber-200 bg-amber-50/30 rounded-3xl overflow-hidden transition shadow-xs">
                  <!-- 抽屜點擊標題列 -->
                  <button type="button" data-drawer-cat="${catKey}"
                    class="drawer-toggle-btn w-full px-6 py-4 flex items-center justify-between bg-gradient-to-r from-amber-100/60 via-orange-50/50 to-white hover:bg-amber-100/80 transition text-left cursor-pointer">

                      <span class="w-9 h-9 rounded-xl bg-amber-200/70 text-amber-900 flex items-center justify-center text-lg shadow-2xs">
                        ${meta.icon}
                      </span>
                      <div>
                        <div class="flex items-center gap-2">
                          <h3 class="font-black text-slate-900 text-sm sm:text-base">${meta.name}</h3>
                          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-200 text-amber-900">
                            ${catTools.length} 個工具

                  </div>
                </div>
              `;
            }).join('')}

        </div>

      const script = document.createElement("script");
      script.src = `${GAS_WEB_APP_URL}?action=verifySpecialTools&password=${encodeURIComponent(password)}&callback=${callbackName}`;

          <div class="border-b border-teal-100 pb-4 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <span class="w-11 h-11 rounded-2xl bg-teal-100 border border-teal-200 flex items-center justify-center text-2xl">💡</span>
              <div>
                <h2 class="text-xl sm:text-2xl font-black text-teal-950">特教宣導資源 · 專業團隊與正向行為支持</h2>
                <p class="text-xs sm:text-sm text-slate-500">點選下方主題按鈕即可切換檢視</p>
              </div>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 border-b border-teal-100 pb-4">
            ${ADVOCACY_SUBTABS.map(sub => {
              const isAct = sub.id === activeAdvocacySubtab;
              return `
                <button type="button" data-adv-subtab="${sub.id}"
                  class="adv-subtab-btn flex items-center gap-1.5 px-3.5 py-2 rounded-2xl font-bold text-xs sm:text-sm border-2 transition ${
                    isAct
                      ? "bg-teal-600 text-white border-teal-700 shadow-2xs"
                      : "bg-teal-50/50 hover:bg-teal-100/70 text-teal-900 border-teal-100"
                  }">
                  <span>${sub.icon}</span>
                  <span>${sub.label}</span>
                </button>
              `;
            }).join("")}
          </div>

          <div>
            ${renderAdvocacySubcontent()}
          </div>
        </section>
      `;
    }

    function renderLinksView() {
      const links = SITE_CONFIG.goodLinks.items;
      const filtered = activeLinksFilter === "all"
        ? links
        : links.filter(l => l.category === activeLinksFilter);

      return `
        <section class="warm-card p-6 space-y-5 w-full">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-teal-100 pb-4">
            <div class="flex items-center gap-3">
              <span class="w-11 h-11 rounded-2xl bg-teal-100 border border-teal-200 flex items-center justify-center text-2xl">🔗</span>
              <div>
                <h2 class="text-xl sm:text-2xl font-black text-teal-950">特教相關好站連結</h2>
                <p class="text-xs sm:text-sm text-slate-500">官方特教行政資源、多媒體教材社群與職能治療專欄</p>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5">
              ${["all", "官方行政與鑑定資源", "教材與社群交流", "專業治療與親職專欄"].map(cat => `
                <button type="button" data-links-filter="${cat}"
                  class="links-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                    activeLinksFilter === cat ? "bg-teal-600 text-white border-teal-700" : "bg-white text-slate-600 border-teal-200"
                  }">
                  ${cat === "all" ? `全部 (${links.length})` : cat}
                </button>
              `).join("")}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${filtered.map(item => `
              <div class="p-5 rounded-2xl bg-teal-50/40 border-2 border-teal-100 hover:border-teal-300 transition flex flex-col justify-between gap-4">
                <div class="space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-white border border-teal-200 text-teal-800">${item.category}</span>
                    <span class="text-2xl">${item.icon}</span>
                  </div>
                  <h3 class="font-black text-slate-900 text-base">${item.title}</h3>
                  <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${item.description}</p>
                </div>
                <div class="pt-3 border-t border-teal-100">
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer"
                    class="block text-center py-2 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs transition">
                    前往網站 ↗
                  </a>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function bindViewportEvents() {
      const vp = document.getElementById("mainViewport");
      if (!vp) return;

      vp.querySelectorAll(".hero-jump-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const targetTab = btn.getAttribute("data-goto-tab");
          const targetSub = btn.getAttribute("data-goto-subtab");
          if (targetTab) activeTab = targetTab;
          if (targetSub) activeAdvocacySubtab = targetSub;
          renderNavigation();
          renderMainViewport();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      // 鑑定提報專區雙頁籤切換
      vp.querySelectorAll(".referral-subtab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeReferralSubtab = btn.getAttribute("data-referral-subtab");
          renderMainViewport();
        });
      });

      vp.querySelectorAll(".btn-quick-legal").forEach(btn => {
        btn.addEventListener("click", () => {
          const critId = btn.getAttribute("data-crit-id");
          openLegalModal(critId);
        });
      });

      const btnOpenLegal = document.getElementById("btnOpenLegalModal");
      if (btnOpenLegal) {
        btnOpenLegal.addEventListener("click", () => {
          openLegalModal(activeCriteriaId);
        });
      }

      vp.querySelectorAll(".crit-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCriteriaId = btn.getAttribute("data-crit-id");
          renderMainViewport();
        });
      });

      // IEP 管理員相關事件
      const btnToggleIepAdmin = document.getElementById("btnToggleIepAdmin");
      if (btnToggleIepAdmin) {
        btnToggleIepAdmin.addEventListener("click", () => {
          if (!isIepAdminUnlocked) {
            document.getElementById("iepAdminPasswordInput").value = "";
            document.getElementById("iepAdminPasswordError").textContent = "";
            document.getElementById("iepAdminLoginDialog").showModal();
          } else {
            isIepAdminDrawerOpen = !isIepAdminDrawerOpen;
            renderMainViewport();
          }
        });
      }

      const btnRefreshIepAdmin = document.getElementById("btnRefreshIepAdmin");
      if (btnRefreshIepAdmin) {
        btnRefreshIepAdmin.addEventListener("click", () => fetchIepBookings("0000"));
      }

      vp.querySelectorAll(".btn-delete-booking").forEach(btn => {
        btn.addEventListener("click", () => {
          const sheet = btn.getAttribute("data-sheet");
          const row = parseInt(btn.getAttribute("data-row"), 10);
          const date = btn.getAttribute("data-date");
          const slot = btn.getAttribute("data-slot");
          executeDeleteBooking(sheet, row, date, slot);
        });
      });

      // 🌟 特教工具箱登入事件
      const btnSubmitSpecialTools = document.getElementById("btnSubmitSpecialToolsLogin");
      const specialToolsInput = document.getElementById("specialToolsPwdInput");
      if (btnSubmitSpecialTools && specialToolsInput) {
        const doSpecialToolsLogin = () => {
          const val = specialToolsInput.value.trim();
          if (!val) {
            document.getElementById("specialToolsPwdError").textContent = "請輸入特教專屬密碼。";
            return;
          }
          document.getElementById("specialToolsPwdError").textContent = "";
          fetchSpecialTools(val);
        };
        btnSubmitSpecialTools.addEventListener("click", doSpecialToolsLogin);
        specialToolsInput.addEventListener("keydown", e => {
          if (e.key === "Enter") doSpecialToolsLogin();
        });
      }

      const btnLockSpecialTools = document.getElementById("btnLockSpecialTools");
      if (btnLockSpecialTools) {
        btnLockSpecialTools.addEventListener("click", () => {
          isSpecialToolsUnlocked = false;
          specialToolsData = [];
          renderMainViewport();
          showToast("已將特教工具箱重新上鎖", "🔒");
        });
      }

      // 🌟 動態折疊抽屜群監聽（支援任意數量的分類抽屜）
      vp.querySelectorAll(".drawer-toggle-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const cat = btn.getAttribute("data-drawer-cat");
          const container = document.getElementById(`drawer-container-${cat}`);
          const textEl = btn.querySelector(".drawer-text");
          const arrowEl = btn.querySelector(".drawer-arrow");

          if (!container) return;

          const isCurrentlyOpen = !container.classList.contains("hidden");
          if (isCurrentlyOpen) {
            container.classList.add("hidden");
            if (textEl) textEl.textContent = "展開工具";
            if (arrowEl) arrowEl.classList.remove("rotate-180");
            openDrawersState[cat] = false;
          } else {
            container.classList.remove("hidden");
            if (textEl) textEl.textContent = "收合工具";
            if (arrowEl) arrowEl.classList.add("rotate-180");
            openDrawersState[cat] = true;
          }
        });
      });

      vp.querySelectorAll(".adv-subtab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeAdvocacySubtab = btn.getAttribute("data-adv-subtab");
          renderMainViewport();
        });
      });

      vp.querySelectorAll(".pbs-filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activePbsFilter = btn.getAttribute("data-pbs-filter");
          renderMainViewport();
        });
      });

      vp.querySelectorAll(".links-filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeLinksFilter = btn.getAttribute("data-links-filter");
          renderMainViewport();
        });
      });
    }

    function renderMainViewport() {
      const vp = document.getElementById("mainViewport");
      if (!vp) return;
      if (activeTab === "home") {
        vp.innerHTML = renderHomeView();
      } else if (activeTab === "iep") {
        vp.innerHTML = renderIepView();
      } else if (activeTab === "referral") {
        vp.innerHTML = renderReferralView();
      } else if (activeTab === "advocacy") {
        vp.innerHTML = renderAdvocacyView();
      } else if (activeTab === "communication") {
        vp.innerHTML = renderCommunicationView();
      } else if (activeTab === "links") {
        vp.innerHTML = renderLinksView();
      } else if (activeTab === "specialTools") {
        vp.innerHTML = renderSpecialToolsView();
      }
      bindViewportEvents();
    }

    function populateCloudModal() {
      const body = document.getElementById("cloudModalBody");
      if (!body) return;
      const allItems = getAllSearchableItems();
      body.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
          ${allItems.map(item => `
            <div class="p-3.5 rounded-2xl bg-teal-50/50 border border-teal-100 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="text-[11px] font-bold text-teal-700">${item.category}</div>
                <div class="font-black text-slate-900 text-xs sm:text-sm truncate mt-0.5">${item.title}</div>
              </div>
              <div class="shrink-0">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer"
                  class="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs">
                  開啟 ↗
                </a>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function handleSearch(query) {
      const sec = document.getElementById("searchResultsSection");
      const kwEl = document.getElementById("searchKeywordDisplay");
      const grid = document.getElementById("searchResultsGrid");
      const clearBtn = document.getElementById("clearSearchBtn");
      const q = (query || "").trim().toLowerCase();

      if (!q) {
        sec.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");
      sec.classList.remove("hidden");
      kwEl.textContent = `「${query}」`;

      const matches = getAllSearchableItems().filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q) ||
        item.desc.toLowerCase().includes(q)
      );

      if (matches.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-5 text-center text-slate-500 text-xs sm:text-sm">
            找不到符合「${query}」的項目，請試試搜尋「學習障礙」、「ABCR」或「王意中」。
          </div>
        `;
        return;
      }

      grid.innerHTML = matches.map(m => `
        <div class="p-4 rounded-2xl bg-white border border-amber-200 flex flex-col justify-between gap-3 shadow-2xs">
          <div>
            <span class="text-[11px] font-bold text-teal-700">${m.category}</span>
            <h4 class="font-black text-slate-900 text-sm mt-1">${m.title}</h4>
            <p class="text-xs text-slate-600 mt-1 line-clamp-2">${m.desc}</p>
          </div>
          <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <a href="${m.url}" target="_blank" rel="noopener noreferrer"
              class="flex-1 text-center py-1.5 px-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs">
              開啟連結 ↗
            </a>
            <button type="button" data-search-tab="${m.tab}" data-search-subtab="${m.subtab || ''}"
              class="search-jump-btn py-1.5 px-3 rounded-xl bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-900 font-bold text-xs">
              前往分頁
            </button>
          </div>
        </div>
      `).join("");

      grid.querySelectorAll(".search-jump-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.getAttribute("data-search-tab");
          const sub = btn.getAttribute("data-search-subtab");
          if (sub) activeAdvocacySubtab = sub;
          renderNavigation();
          renderMainViewport();
          sec.classList.add("hidden");
        });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderNavigation();
      renderMainViewport();
      populateCloudModal();

      document.getElementById("brandHomeTrigger").addEventListener("click", () => {
        activeTab = "home";
        renderNavigation();
        renderMainViewport();
      });

      const searchInput = document.getElementById("globalSearchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const closeSearchBtn = document.getElementById("closeSearchBtn");

      searchInput.addEventListener("input", e => handleSearch(e.target.value));
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        handleSearch("");
      });
      closeSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        handleSearch("");
      });

      const cloudModal = document.getElementById("cloudModal");
      document.getElementById("btnCloudDirectory").addEventListener("click", () => {
        cloudModal.classList.remove("hidden");
      });
      document.getElementById("btnCloseCloudModal").addEventListener("click", () => {
        cloudModal.classList.add("hidden");
      });
      cloudModal.addEventListener("click", e => {
        if (e.target === cloudModal) cloudModal.classList.add("hidden");
      });

      // IEP 管理員對話框事件
      document.getElementById("btnCancelIepAdminLogin").onclick = () => {
        document.getElementById("iepAdminLoginDialog").close();
      };

      const handleIepLogin = () => {
        const pwd = document.getElementById("iepAdminPasswordInput").value;
        if (pwd !== "0000") {
          document.getElementById("iepAdminPasswordError").textContent = "密碼錯誤，請重新輸入。";
          return;
        }
        document.getElementById("iepAdminLoginDialog").close();
        fetchIepBookings("0000");
      };

      document.getElementById("btnSubmitIepAdminLogin").onclick = handleIepLogin;
      document.getElementById("iepAdminPasswordInput").onkeydown = e => {
        if (e.key === "Enter") handleIepLogin();
      };
    });
  </script>
</body>
</html>
